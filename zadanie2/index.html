
<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menučka pri FEI | Obedové menu v okolí FEI STU</title>
    <meta name="description" content="Obedové menu reštaurácií v okolí FEI STU v Bratislave. Vyberte si deň, porovnajte ceny jedál a pozrite si alergény aj polohu reštaurácií.">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="sk_SK">
    <meta property="og:site_name" content="Menučka pri FEI">
    <meta property="og:title" content="Menučka pri FEI | Obedové menu v okolí FEI STU">
    <meta property="og:description" content="Pozrite si obedové menu v okolí FEI STU. Ponuku môžete filtrovať podľa dňa a reštaurácie a porovnať ceny aj uvedené alergény.">
    <meta property="og:image" content="https://webte1.fei.stuba.sk/~xgabriss1/zadanie2/assets/favicon.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="Ikona Menučka pri FEI – tanier s príborom">

    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1><img src="assets/favicon.svg" width="36" height="36" alt="">Menučka pri FEI</h1>

        <nav aria-label="Hlavná navigácia">
            <button class="menuToggle" type="button"
                    aria-label="Otvoriť navigáciu"
                    aria-expanded="false">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

            <ul>
                <li><a href="index.html" class="active">Denné menu</a></li>
                <li><a href="about.html">O projekte</a></li>
            </ul>
        </nav>
    </header>

    <main class="container-fluid py-4">

    <div class="pageLayout">

        <section class="leftLayout">

            <p class="mb-2 schoolAddress">
                <i class="bi bi-geo-alt-fill"></i>
                FEI STU · Ilkovičova 3, Bratislava
            </p>

            <h2 class="display-3 motto">Čo je dnes na obed?</h2>

            <p class="dateLine">
                Dnes je <span id="currentDate"></span>
            </p>

            

        </section>

 
        <section class="rightLayout" aria-label="Mapa okolia fakulty">
            <div id="map"></div>
        </section>

        
        <aside class="card filters">
            <div class="card-header">
                <i class="bi bi-funnel-fill"></i>
                Filter reštaurácií
            </div>
        
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox"
                               id="Rest1" checked>
                        <label class="form-check-label" for="Rest1">
                            Idyla Cafe &amp; Restaurant 2
                        </label>
                    </div>
                
                    <button class="btn btn-sm locationButton"
                            type="button"
                            data-restaurant="Rest1"
                            aria-label="Zobraziť Idyla Cafe &amp; Restaurant 2 na mape">
                        <i class="bi bi-geo-alt-fill"></i>
                    </button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox"
                               id="Rest2" checked>
                        <label class="form-check-label" for="Rest2">
                            Reštaurácia DRAG
                        </label>
                    </div>
                
                    <button class="btn btn-sm locationButton"
                            type="button"
                            data-restaurant="Rest2"
                            aria-label="Zobraziť Reštauráciu DRAG na mape">
                        <i class="bi bi-geo-alt-fill"></i>
                    </button>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox"
                               id="Rest3" checked>
                        <label class="form-check-label" for="Rest3">
                            Eat &amp; Meet
                        </label>
                    </div>
                
                    <button class="btn btn-sm locationButton"
                            type="button"
                            data-restaurant="Rest3"
                            aria-label="Zobraziť Eat &amp; Meet na mape">
                        <i class="bi bi-geo-alt-fill"></i>
                    </button>
                </div>
            
            </div>
        </aside>

        <section class="menuLayout">

            <div class="d-flex align-items-center flex-wrap gap-3 mb-3">
                <h3 class="fs-4 mb-0">Vyber deň</h3>
                <span id="foodCount">Počet jedál: …</span>
            </div>

            <div class="dayButtons" role="group" aria-label="Výber dňa">
            
                <button class="btn dayButton" data-day="1" type="button">
                    Po
                </button>
            
                <button class="btn dayButton" data-day="2" type="button">
                    Ut
                </button>
            
                <button class="btn dayButton" data-day="3" type="button">
                    St
                </button>
            
                <button class="btn dayButton" data-day="4" type="button">
                    Št
                </button>
                <button class="btn dayButton" data-day="5" type="button">
                    Pia
                </button>
                <button class="btn dayButton lastButton" data-day="all" type="button">
                    Celý týždeň
                </button>
            </div>
            <div id="menuContent" class="mt-4" aria-live="polite" aria-busy="true">
                <p class="text-secondary" role="status">Načítavam menu…</p>
            </div>
            
        </section>

    </div>

</main>

    <footer>
        <p>© 2026 Menučka pri FEI</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/locale/sk.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="js/idyla.js"></script>
    <script src="js/drag.js"></script>
    <script src="js/eat-and-meet.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
