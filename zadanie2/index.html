
<!DOCTYPE html>
<html lang="sk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menučka pri FEI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Menučka pri FEI</h1>

        <nav aria-label="Hlavná navigácia">
            <button class="menuToggle" type="button"
                    aria-label="Otvoriť navigáciu"
                    aria-expanded="false">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

            <ul>
                <li><a href="index.html" class="active">Denné menu</a></li>
                <li><a href="about.html">O projekte</a></li>
            </ul>
        </nav>
    </header>

    <main class="container-fluid py-4">

    <div class="pageLayout">

        <section class="leftLayout">

            <p class="mb-2 schoolAddress">
                <i class="bi bi-geo-alt-fill"></i>
                FEI STU · Ilkovičova 3, Bratislava
            </p>

            <h2 class="display-3 motto">Čo je dnes na obed?</h2>

            <p class="dateLine">
                Dnes je <time id="currentDate"></time>
            </p>

            <h3 id="foodCount" class="display-7">
                Počet jedál v dnešnej ponuke: 
            </h3>
            

        </section>

 
        <section class="rightLayout" aria-label="Mapa okolia fakulty">
            <div id="map"></div>
        </section>

        
        <aside class="card filters">
            <div class="card-header">
                <i class="bi bi-funnel-fill"></i>
                Filter reštaurácií
            </div>
        
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox"
                               id="Rest1" checked>
                        <label class="form-check-label" for="Rest1">
                            Rest1
                        </label>
                    </div>
                
                    <button class="btn btn-sm locationButton"
                            type="button"
                            aria-label="Zobraziť Rest1 na mape">
                        <i class="bi bi-geo-alt-fill"></i>
                    </button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox"
                               id="Rest2" checked>
                        <label class="form-check-label" for="Rest2">
                            Rest2
                        </label>
                    </div>
                
                    <button class="btn btn-sm locationButton"
                            type="button"
                            aria-label="Zobraziť Rest2 na mape">
                        <i class="bi bi-geo-alt-fill"></i>
                    </button>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox"
                               id="Rest3" checked>
                        <label class="form-check-label" for="Rest3">
                            Rest3
                        </label>
                    </div>
                
                    <button class="btn btn-sm locationButton"
                            type="button"
                            aria-label="Zobraziť Rest3 na mape">
                        <i class="bi bi-geo-alt-fill"></i>
                    </button>
                </div>
            
            </div>
        </aside>

        <section class="menuLayout">

            <h3 class="fs-4 mb-3">Vyber deň</h3>

            <div class="dayButtons" role="group" aria-label="Výber dňa">
            
                <button class="btn dayButton" data-day="1" type="button">
                    Po
                </button>
            
                <button class="btn dayButton" data-day="2" type="button">
                    Ut
                </button>
            
                <button class="btn dayButton" data-day="3" type="button">
                    St
                </button>
            
                <button class="btn dayButton" data-day="4" type="button">
                    Št
                </button>
                <button class="btn dayButton" data-day="5" type="button">
                    Pia
                </button>
                <button class="btn dayButton lastButton" data-day="all" type="button">
                    Celý týždeň
                </button>
            </div>
            
        </section>

    </div>

</main>

    <footer>
        <p>© 2026 Menučka pri FEI</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/locale/sk.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="js/script.js"></script>
</body>
</html>
